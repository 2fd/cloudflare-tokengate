name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm lint
      - name: Typecheck (including generated Worker types)
        run: pnpm typecheck
      - name: Tests (run inside workerd)
        run: pnpm test
      - name: Deployment guardrails, threat-model coverage and action script tests
        run: pnpm test:scripts
      - name: Deployment guardrails self-test
        run: bash test/security/check-config-test.sh
      - name: get-token action behaviour (token masking, input validation)
        run: bash test/security/get-token-action.sh

  workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # zizmor-action uploads SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Static analysis of GitHub Actions (zizmor)
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
