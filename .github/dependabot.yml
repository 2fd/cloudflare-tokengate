version: 2
updates:
  - package-ecosystem: npm
    # The root entry covers every pnpm workspace package (apps/*, packages/*) via pnpm-lock.yaml.
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directories: [/, /actions/get-token]
    schedule:
      interval: weekly
